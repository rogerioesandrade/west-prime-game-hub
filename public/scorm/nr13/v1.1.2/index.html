<script src="scorm.js"></script><script src="touch.js"></script><script>

let lang='pt',instance=null,begun=false,unityReady=false,pendingStart=false,device=null,loadingStarted=false;
const builds={"desktop":{"base":"Desktop/Build/","loader":"Desktop.loader.js","data":"Desktop.data.unityweb","framework":"Desktop.framework.js.unityweb","code":"Desktop.wasm.unityweb","bytes":261699630,"mb":261.7},"mobile":{"base":"Mobile/Build/","loader":"Mobile.loader.js","data":"Mobile.data.unityweb","framework":"Mobile.framework.js.unityweb","code":"Mobile.wasm.unityweb","bytes":90093707,"mb":90.1}};
const mobileWords={pt:{title:'Como você vai jogar?',description:'Escolha seu dispositivo antes de iniciar.',mobile:'Celular',mobileDescription:'Versão leve com controles de toque.',desktop:'Computador',desktopDescription:'Qualidade visual completa. Teclado e mouse.',change:'Trocar dispositivo',rotate:'Gire o celular',rotateDescription:'Jogue com a tela na horizontal.',walk:'CAMINHAR',look:'Arraste para olhar',load:'Download do perfil ',mb:' MB. Após o download, aguarde a preparação do cenário.'},en:{title:'How will you play?',description:'Choose your device before starting.',mobile:'Mobile',mobileDescription:'Lightweight version with touch controls.',desktop:'Computer',desktopDescription:'Full visual quality. Keyboard and mouse.',change:'Change device',rotate:'Rotate your phone',rotateDescription:'Play in landscape orientation.',walk:'WALK',look:'Drag to look',load:'Downloading ',mb:' MB. After downloading, wait for the scene to initialize.'},es:{title:'¿Cómo va a jugar?',description:'Elija su dispositivo antes de iniciar.',mobile:'Celular',mobileDescription:'Versión ligera con controles táctiles.',desktop:'Computador',desktopDescription:'Calidad visual completa. Teclado y ratón.',change:'Cambiar dispositivo',rotate:'Gire el celular',rotateDescription:'Juegue con la pantalla horizontal.',walk:'CAMINAR',look:'Arrastre para mirar',load:'Descargando ',mb:' MB. Tras la descarga, espere a que se prepare la escena.'}};
window.WGSend=(method,value)=>{if(instance&&unityReady){if(value===undefined)instance.SendMessage('WG_NR13_Game',method);else instance.SendMessage('WG_NR13_Game',method,value);}};
try{const saved=localStorage.getItem('wg-nr13-language');if(words[saved])lang=saved;}catch(_){}
const $=id=>document.getElementById(id),canvas=$('unity-canvas');
function show(id){for(const name of ['devices','welcome','languages','loading','exit-dialog'])$(name).hidden=name!==id;}
function localize(){const w=words[lang];document.documentElement.lang=lang;document.body.dataset.language=lang;for(const id of ['start','full','exit','language','back']){$(id).textContent=id==='start'&&WGSCORM.resume&&!WGSCORM.completed?w.resume:w[id];$(id).setAttribute('aria-label',$(id).textContent);}if(WGSCORM.resume&&!WGSCORM.completed)$('start').classList.add('resuming');$('language-title').textContent=w.choose;$('loading-title').textContent=w.loading;$('connection').textContent=WGSCORM.connected?w.connected:w.preview;if(instance)instance.SendMessage('WG_NR13_Game','SetLanguage',lang);
const m=mobileWords[lang];for(const [id,key] of Object.entries({'device-title':'title','device-description':'description','mobile-title':'mobile','mobile-description':'mobileDescription','desktop-title':'desktop','desktop-description':'desktopDescription','switch-device':'change','rotate-title':'rotate','rotate-description':'rotateDescription','move-label':'walk','look-label':'look'}))$(id).textContent=m[key];$('touch-pause').setAttribute('aria-label',lang==='en'?'Pause':lang==='es'?'Pausa':'Pausa');}
function selectDevice(value){if(loadingStarted)return;device=value;document.body.dataset.device=value;show('welcome');WGTouch.viewport();$('start').focus();}
$('choose-mobile').onclick=()=>selectDevice('mobile');$('choose-desktop').onclick=()=>selectDevice('desktop');$('switch-device').onclick=()=>{if(!loadingStarted){document.body.dataset.device='';device=null;show('devices');WGTouch.viewport();}};
$('language').onclick=()=>{show('languages');document.querySelector('[data-lang="'+lang+'"]').focus();};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('wg-nr13-language',lang);}catch(_){}localize();show('welcome');$('start').focus();});
$('back').onclick=()=>show('welcome');$('full').onclick=async()=>{try{if(!document.fullscreenElement)await $('game').requestFullscreen();else await document.exitFullscreen();}catch(_){$('connection').textContent=words[lang].fullError;}};
function exit(){WGTouch.hide();const saved=WGSCORM.finish();show('exit-dialog');$('exit-title').textContent=words[lang].exitTitle;$('exit-message').textContent=saved?words[lang].exitMessage:words[lang].saveError;$('retry-save').hidden=saved;$('retry-save').textContent=words[lang].retry;}
$('exit').onclick=exit;
$('retry-save').onclick=exit;
function enter(){if(!instance||!unityReady)return;pendingStart=false;begun=true;show('none');instance.SendMessage('WG_NR13_Game','SetDeviceMode',device);instance.SendMessage('WG_NR13_Game','SetLanguage',lang);instance.SendMessage('WG_NR13_Game','BrowserBegin',WGSCORM.completed?'':WGSCORM.resume);canvas.focus();WGTouch.viewport();if(device==='mobile'&&innerHeight>innerWidth)WGSend('BrowserVisibility','0');}
window.WGTraining={ready(){unityReady=true;if(pendingStart)enter();},touchState(json){WGTouch.state(JSON.parse(json));},exit};
$('start').onclick=()=>{
 if(!device){show('devices');return;}if(loadingStarted||pendingStart)return;
 pendingStart=true;loadingStarted=true;show('loading');const profile=builds[device],m=mobileWords[lang];
 $('load-detail').textContent=m.load+m[device]+(profile.mb?' · '+profile.mb+m.mb:'');
 const script=document.createElement('script');script.src=profile.base+profile.loader;
 script.onerror=()=>{$('load-status').textContent=words[lang].error;};
 script.onload=()=>{createUnityInstance(canvas,{dataUrl:profile.base+profile.data,frameworkUrl:profile.base+profile.framework,codeUrl:profile.base+profile.code,streamingAssetsUrl:profile.base+'../StreamingAssets',companyName:'West Group',productName:'Simulador NR-13',productVersion:'1.1.2',devicePixelRatio:device==='mobile'?Math.min(1,window.devicePixelRatio||1):window.devicePixelRatio,showBanner:(message,type)=>{if(type==='error')$('load-status').textContent=words[lang].error;}},p=>{$('progress').value=p;$('load-status').textContent=Math.round(p*100)+'%';}).then(i=>{instance=i;if(unityReady)enter();}).catch(()=>{$('load-status').textContent=words[lang].error;});};document.body.appendChild(script);
};
window.addEventListener('wg-save',()=>{if(WGSCORM.issue&&WGSCORM.issue!=='preview')$('connection').textContent=words[lang].saveError;});
localize();show('devices');
</script></body></html>
